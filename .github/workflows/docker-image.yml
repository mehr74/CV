name: Push Resume to S3

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
 
    - name: Set AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::615677714887:role/personal-mehrshad-resume-role
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Run the Docker image
      run: |
        ls ${{ github.workspace }}/src
   
    - name: Run the Docker image
      run: |
        docker run --rm -v ${{ github.workspace }}/src:/usr/src \
        615677714887.dkr.ecr.eu-central-1.amazonaws.com/personal-mehrshad-resume-repo:latest \
        make
   
    - name: Upload to S3
      if: github.ref == 'refs/heads/main'
      run: aws s3 cp CV.Mehrshad.Lotfi.de.pdf s3://mehrshad-cv --acl public-read
